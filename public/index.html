<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>PossaniMix</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section>
        <header>
            <h1>PossaniMix</h1>
            <img src="./carrinho-compras.png" alt="" width="100px">
        </header>

        <form id="formPet">
            <label for="nome">Produto:</label>
            <input type="text" id="nome" placeholder="Ex: Arroz 5kg" required>

            <br><br>

            <label for="quantidade">Quantidade:</label>
            <input type="text" id="quantidade" placeholder="Ex: 2" required>

            <br><br>

            <label for="preco">Preço:</label>
            <input type="text" id="preco" placeholder="Ex: 12,50" required>

            <br><br>

            <button type="submit">Adicionar</button>
        </form>

        <div id="Edicao" style="display: none;">
            <h2>Editar Produto</h2>
            <input type="hidden" id="editarID">

            <label for="editarNome">Produto:</label>
            <input type="text" id="editarNome" required>

            <br><br>

            <label for="editarQuantidade">Quantidade:</label>
            <input type="text" id="editarQuantidade" required>

            <br><br>

            <label for="editarPreco">Preço:</label>
            <input type="number" id="editarPreco" step="0.01" required>

            <br><br>

            <button onclick="salvarEdicao()">Salvar Alterações</button>
            <button onclick="descartarEdicao()">Cancelar</button>
        </div>

        <hr>
        <div id="listaProdutos"></div>

        <hr>
        <div id="totalCompra">Total: R$ 0,00</div>
    </section>

    <script src="script.js"></script>
</body>

</html>
